<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090A" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Pessoas e agentes de IA trabalhando juntos." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Mago OS</title>
    <script>
      // Aplica o tema escolhido antes de desenhar a página, para não piscar.
      try {
        const tema = localStorage.getItem("mago.tema");
        if (tema === "claro") document.documentElement.dataset.theme = "light";
        if (tema === "escuro") document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
