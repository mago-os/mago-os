# Verificação automática (M0-07): roda em todo PR e em toda mudança na main.
# Os nomes dos trabalhos ("Tipos, estilo e testes", "Testes de tela", "Segurança") são os que a proteção da main exige.
name: Verificação

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # segunda, 06:00 em Brasília: segurança semanal, mesmo sem mudanças
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codigo:
    name: Tipos, estilo e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mago
          POSTGRES_DB: mago
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54318:5432"]
        options: >-
          --health-cmd "pg_isready -U mago -d mago"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      MAGO_EXIGIR_BANCO: "1"
      MAGO_TESTE_BANCO_URL: postgres://mago@127.0.0.1:54318/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm tipos
      - name: Estilo
        run: pnpm estilo
      - name: Testes de unidade e com PostgreSQL real
        run: pnpm testes

  telas:
    name: Testes de tela
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mago
          POSTGRES_DB: mago
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54318:5432"]
        options: >-
          --health-cmd "pg_isready -U mago -d mago"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrações no banco de teste
        run: pnpm migrar
        env:
          DATABASE_URL_DONO: postgres://mago@127.0.0.1:54318/mago
      - name: Navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Testes de tela (celular e computador)
        run: pnpm telas:testes
      - name: Guardar o relatório se falhar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes-de-tela
          path: playwright-report/
          retention-days: 7

  # M6-05: a versão que está no ar continua funcionando com o banco já migrado pela versão nova (a publicação roda as
  # migrações antes de trocar a versão, e a anterior fica no ar alguns segundos, ou de vez se a nova falhar). Roda os
  # testes da main com as migrações deste PR. Só quando o PR muda as migrações.
  compatibilidade:
    name: Banco novo com a versão anterior
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mago
          POSTGRES_DB: mago
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54318:5432"]
        options: >-
          --health-cmd "pg_isready -U mago -d mago"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      MAGO_EXIGIR_BANCO: "1"
      MAGO_TESTE_BANCO_URL: postgres://mago@127.0.0.1:54318/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: O PR muda as migrações?
        id: mudou
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- nucleo/migracoes; then
            echo "nova=nao" >> "$GITHUB_OUTPUT"; echo "Sem migração nova: nada a conferir."
          else
            echo "nova=sim" >> "$GITHUB_OUTPUT"
          fi
      - name: A versão anterior (a main) com as migrações deste PR
        if: steps.mudou.outputs.nova == 'sim'
        run: |
          git worktree add ../anterior "origin/${{ github.base_ref }}"
          rm -rf ../anterior/nucleo/migracoes
          cp -r nucleo/migracoes ../anterior/nucleo/migracoes
      - uses: pnpm/action-setup@v6
        if: steps.mudou.outputs.nova == 'sim'
      - uses: actions/setup-node@v7
        if: steps.mudou.outputs.nova == 'sim'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Testes da versão anterior contra o banco novo
        if: steps.mudou.outputs.nova == 'sim'
        working-directory: ../anterior
        # A documentação gerada do banco muda de propósito com a migração nova; o resto tem que passar.
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run --exclude "**/documentacao-banco.test.ts" --exclude "**/node_modules/**"

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Bibliotecas com falhas conhecidas (graves ou críticas)
        run: pnpm audit --audit-level high
      - name: Senhas e chaves esquecidas no código (gitleaks, todo o histórico)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact -v
      - name: Falhas nas bibliotecas e na configuração dos containers (Trivy, graves ou críticas)
        run: >-
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.76.2 fs --quiet --scanners vuln,misconfig
          --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore.yaml --skip-dirs /src/node_modules
          --exit-code 1 /src
