# Publicação na produção (M6-05, decisão 6 da spec do M6). Só roda quando alguém pede (Actions › Publicação na
# produção › Run workflow) e só continua depois que o Sandro aprova (ambiente "producao", com ele como aprovador
# obrigatório). Não monta imagem nova: a produção recebe a mesma imagem que já passou pelo teste (e pelo Trivy).
# O que este fluxo faz é marcar essa imagem como ":producao"; a VPS02 confere a cada minuto, faz o backup, publica
# sem parar o sistema e, se a versão nova não ficar saudável, a anterior continua no ar.
name: Publicação na produção

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Commit (sha completo) da versão. Vazio: a que está no teste agora."
        required: false
        default: ""

permissions:
  contents: write # registrar a versão no histórico (Releases)
  packages: write # marcar a imagem como :producao

concurrency:
  group: publicacao-producao
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar na produção
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: producao
      url: https://app.osmago.com
    env:
      IMAGEM: ghcr.io/mago-os/mago-os
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Escolher a versão (a do teste, se não vier outra)
        env:
          PEDIDA: ${{ inputs.versao }}
        run: |
          versao="$PEDIDA"
          if [ -z "$versao" ]; then
            versao=$(curl -fsS https://teste.osmago.com/api/saude | jq -r .versao)
          fi
          [[ "$versao" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Versão inválida: $versao"; exit 1; }
          # Só vai para a produção o que está na main (passou pela verificação e pelo "ok" do Sandro no PR).
          git merge-base --is-ancestor "$versao" origin/main || { echo "::error::$versao não está na main"; exit 1; }
          echo "VERSAO=$versao" >> "$GITHUB_ENV"

      - name: Conferir que a imagem existe e passou pelo teste
        run: |
          # A imagem da versão só existe se a publicação no teste montou e conferiu (Trivy) essa versão.
          docker buildx imagetools inspect "$IMAGEM:$VERSAO" >/dev/null \
            || { echo "::error::Não há imagem conferida da versão ${VERSAO:0:7}: publique no teste primeiro."; exit 1; }

      - name: Marcar a imagem como a da produção
        run: docker buildx imagetools create --tag "$IMAGEM:producao" "$IMAGEM:$VERSAO"

      - name: Registrar a aprovação no histórico de versões
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # O registro é da aprovação: a publicação de fato fica no histórico da VPS (estado/historico).
          marca="producao-$(TZ=America/Sao_Paulo date +%Y%m%d-%H%M)-${VERSAO:0:7}"
          gh release create "$marca" --target "$VERSAO" --generate-notes \
            --title "Aprovada para a produção $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') (${VERSAO:0:7})"
          echo "A VPS02 publica em até 1 minuto (com backup antes). Acompanhar: journalctl -u mago-os-producao-publicar"
