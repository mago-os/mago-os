# Pastas do monorepo. Cada pasta é um pacote com nome @mago-os/<pasta>.
packages:
  - nucleo
  - contratos
  - telas
  - testes
  - modulos/*

# Versões aprovadas na spec (M0-01). Todo pacote usa "catalog:" em vez de escrever a versão,
# então mudar uma versão é mudar só esta lista, sempre numa tarefa própria.
catalog:
  typescript: 7.0.2
  fastify: 5.12.8
  react: 19.3.1
  react-dom: 19.3.1
  vite: 8.3.8
  vitest: 5.1.0
  "@biomejs/biome": 2.6.7
  "@types/node": 26.6.6
  pg: 8.23.1
  "@types/pg": 8.23.1
  pg-boss: 12.38.2
  node-pg-migrate: 9.0.0
  "@opentelemetry/api": 1.10.0
  "@opentelemetry/sdk-node": 0.301.2
  "@opentelemetry/instrumentation-http": 0.301.2
  "@opentelemetry/instrumentation-pg": 0.78.0
  "@fastify/otel": 1.0.1
  "@vitejs/plugin-react": 6.3.0
  tailwindcss: 4.3.5
  "@tailwindcss/vite": 4.3.5
  vite-plugin-pwa: 2.0.0
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  lucide-react: 1.73.0
  "@fontsource-variable/geist": 5.3.0
  "@fontsource-variable/geist-mono": 5.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  radix-ui: 1.8.1
  "@playwright/test": 1.65.1
  typebox: 1.4.7
  better-auth: 1.7.25
  "@better-auth/passkey": 1.7.25
  "@simplewebauthn/browser": 13.3.0
  qrcode: 1.5.4
  "@types/qrcode": 1.5.6
  "@fastify/websocket": 11.3.7

# Só instala versões publicadas há pelo menos 1 dia (protege contra pacote adulterado recém-publicado).
minimumReleaseAge: 1440

# Scripts de instalação de pacotes ficam bloqueados por padrão (segurança). Liberar só com motivo.
# protobufjs: o script dele só mostra um aviso; não precisa rodar.
allowBuilds:
  protobufjs: false

# Alertas de segurança ignorados pelo `pnpm audit`, sempre com motivo, aprovação do Sandro e data para rever.
auditConfig:
  ignoreGhsas:
    # picomatch <= 4.0.7, ReDoS com padrões extglob (alerta de 17/11/2026). Ainda não há versão corrigida no npm.
    # Só as ferramentas de teste e de build usam (vitest, vite, tinyglobby); o sistema nunca passa texto de usuário
    # para um padrão de glob. Aprovado pelo Sandro no chat em 17/11/2026. Tirar daqui assim que sair a 4.0.8.
    - GHSA-fc5q-39xc-vjpf
