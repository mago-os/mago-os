# pgBackRest do Mago OS. Credenciais, endpoint e senha de criptografia vêm do ambiente (backup.env, gerado do Infisical).
# Três depósitos no mesmo bucket do Backblaze B2, para guardar por 30 dias, 3 meses e 1 ano (M0-11):
#   repo1 /pgbackrest          cópia completa diária + diário de alterações: volta a qualquer momento dos últimos 30 dias
#   repo2 /pgbackrest-semanal  cópia completa semanal (domingo), guardada por 90 dias
#   repo3 /pgbackrest-mensal   cópia completa mensal (dia 1), guardada por 1 ano
# Em repo2 e repo3 o diário de alterações só é guardado o necessário para cada cópia abrir (pontos fixos).
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-bundle=y
repo1-retention-full-type=time
repo1-retention-full=30

repo2-type=s3
repo2-path=/pgbackrest-semanal
repo2-cipher-type=aes-256-cbc
repo2-bundle=y
repo2-retention-full-type=time
repo2-retention-full=90
repo2-retention-archive-type=full
repo2-retention-archive=1

repo3-type=s3
repo3-path=/pgbackrest-mensal
repo3-cipher-type=aes-256-cbc
repo3-bundle=y
repo3-retention-full-type=time
repo3-retention-full=365
repo3-retention-archive-type=full
repo3-retention-archive=1

compress-type=zst
start-fast=y
process-max=1
log-level-console=info
log-level-file=detail

[mago]
pg1-path=/var/lib/postgresql/18/docker
pg1-user=mago
pg1-database=mago
