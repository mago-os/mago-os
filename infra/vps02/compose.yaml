name: mago-os
services:
  db:
    image: mago-os-db:pg17
    restart: unless-stopped
    env_file: [.env, backup.env]
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=mago archive-push %p
      - -c
      - archive_timeout=300
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./pgbackrest:/etc/pgbackrest:ro
      - pgbackrest-log:/var/log/pgbackrest
    networks: [mago_db, mago_backup]
    shm_size: 256m
    deploy:
      resources:
        limits: { memory: 1536M, cpus: "1.0" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mago -d mago"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  db-data:
  pgbackrest-log:
networks:
  mago_db:
    internal: true
  mago_backup: {}
  mago_edge: {}
