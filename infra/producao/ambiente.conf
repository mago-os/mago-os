# Ambiente da produção na VPS02 (M6-05). Os scripts de bin/ (os mesmos do teste) leem este arquivo; sem ele, valem
# os padrões do teste. Fica em /opt/mago-os-producao/ambiente.conf (sem segredo nenhum).
AMBIENTE=producao
PROJETO=mago-os-producao
TAG=producao
DOMINIO=app.osmago.com
PORTA_AZUL=3201
PORTA_VERDE=3202
TELAS=/srv/mago-os-producao/telas
CADDY=/etc/caddy/mago-os-producao.caddy
BACKUP_ANTES_DE_PUBLICAR=1
# Projeto mago-os-producao no Infisical (só a identidade vps02-producao lê).
INFISICAL_PROJETO=PREENCHER_COM_O_ID_DO_PROJETO
INFISICAL_AMBIENTE=prod
DEPOSITO_AUDITORIA=mago-os-producao-auditoria
# Até o DNS (M6-05b), o Caddy usa certificado próprio para app.osmago.com: a conferência local aceita (-k).
CURL_EXTRA=-k
